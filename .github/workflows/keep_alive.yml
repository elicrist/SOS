name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * 1,4'   # Monday and Thursday, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" "$SB_URL/rest/v1/ec_user_prefs?select=owner_id&limit=1" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"
